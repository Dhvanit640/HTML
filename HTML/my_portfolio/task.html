<script>
    // Get the query string part of the URL

    const urlParams = new URLSearchParams(queryString);
    // Get individual parameters
    window.token = urlParams.get('token'); // "Mukesh" callajax(finalurl)
    window.targetcloud = (urlParams.get('cloudcode')!='' && urlParams.get('cloudcode')!=null)?urlParams.get('cloudcode'): top.document.forms[0]["cloudcode"].value;//urlParams.get('targetcloud');   // "30"
    window.targetuser = (urlParams.get('targetuser')!='' && urlParams.get('targetuser')!=null)?urlParams.get('targetuser'):top.document.forms[0]["username"].value;

<body>
    
    <div id="scheduler"></div>



<script>

function callajax(finalurl)
{
    var returndata = "";
    $.ajax({
        url : finalurl,
        async : false,
        contentType: false,
        processData: false,
        type: 'POST',
        success : function(data) 
        {
            returndata = data
        },
        error:function(e)
        {
            
        }
    });
    $("#loader-html").css("display","none");
    return returndata;
}

function showCalender() {
    var getUrl = window.location;
    var baseurl = getUrl.protocol + "//" + getUrl.host + "/" + getUrl.pathname.split("/")[1];
    baseurl = baseurl.split("pages")[0];

    // var cloudcode = top.document.forms[0]["cloudcode"].value;
    // var username = top.document.forms[0]["username"].value;

    var cloudcode = window.targetcloud;
    var username = window.targetuser;
    var tokenParam = window.token ? `&token=${encodeURIComponent(window.token)}` : "";

    // Get current date
    const currentDate = new Date();
    const currentYear = currentDate.getFullYear();
    const currentMonth = currentDate.getMonth() + 1;
    const lastDayOfMonth = new Date(currentYear, currentMonth, 0).getDate();
    const startDate = `${currentYear}-01-01`;
    const endDate = `${currentYear}-${currentMonth < 10 ? '0' + currentMonth : currentMonth}-${lastDayOfMonth}`;

    var urltotal = `${baseurl}getFunction.do?actn=getsqljsondata&sqlfieldid=65925&cloudcode=${encodeURIComponent(cloudcode)}&ids=valuestring/&valuestring=Leave_Meeting_Holiday_Calender@d@${encodeURIComponent(username)}@d@${encodeURIComponent(startDate)}@d@${encodeURIComponent(endDate)}@d@${tokenParam}`;
    
    var data = callajax(urltotal);
    data = JSON.parse(data);

    if (data[0].txt == "txt is null") {
        $("#scheduler").html(`<div style="align-items: center;display: flex;justify-content: center;height: -webkit-fill-available;">No Data Found</div>`);
        return;
    }

    data = JSON.parse(data[0].txt);

    var schedulerElement = $("#scheduler");
    var scheduler = schedulerElement.data("kendoScheduler");

    if (scheduler) {
        schedulerElement.empty();
        scheduler.destroy();
    }

    var record = [];
    
    for (var i = 0; i < data.length; i++) {
        var color, subject, participant;
        var meetingid = "";  // Declare meetingid before using it
        
        if (data[i].agenda == '' && data[i].holiday_name != '') {
            color = '#9900CC';
            subject = data[i].holiday_name;
            participant = "All";
        } else if (data[i].agenda != '' && data[i].holiday_name == '') {
            color = '#F69739';
            subject = data[i].agenda ? data[i].agenda : "";
            participant = data[i].meeting_coordinator ? data[i].meeting_coordinator : "";
            meetingid = data[i] && data[i].meeting_id ? data[i].meeting_id : "";
        } else if (parseFloat(data[i].leave_count1) > 0) {
            color = '#008e13';
            subject = data[i].leave_type ? data[i].leave_type : "";
            participant = data[i].emp_name ? data[i].emp_name : "";
            meetingid = data[i] && data[i].leave_count1 ? data[i].leave_count1 : "";
        } 
        // else {
        //     color = '#6D8BE1';
        //     subject = "";
        //     participant = "";
        //     meetingid = data[i] && data[i].meeting_id ? data[i].meeting_id : "";
        // }

        var fromdate = data[i].startdate;
        var parts = fromdate.split("-");
        var fdate = `${parts[2]}-${parts[1]}-${parts[0]}`;

        var todate = data[i].enddate;
        if (todate == "00-00-0000") {
            todate = fromdate;
        }

        var partss = todate.split("-");
        var edate = `${partss[2]}-${partss[1]}-${partss[0]}`;

        record.push({
            name: [participant, subject, meetingid].filter(part => part).join(" - "),
            start: fdate,
            end: edate,
            background: color
        });

    }

    $(function () {
        $("#scheduler").kendoScheduler({
            views: ["day", "week", { type: "month", selected: true }],
            dataSource: {
                data: record,
                schema: {
                    model: {
                        id: "taskId",
                        fields: {
                            taskId: { type: "number" },
                            name: { defaultValue: "No title", validation: { required: true } },
                            start: { type: "date", format: "YYYY-MM-DD" },
                            end: { 
                                type: "date",
                                format: "YYYY-MM-DD",
                                parse: function(value) {
                                    var endOfDay = new Date(value);
                                    endOfDay.setHours(23, 59, 59);
                                    return endOfDay;
                                }
                            },
                            description: { defaultValue: "" },
                            ownerId: { defaultValue: 1 },
                            isAllDay: { type: "boolean" },
                            background: { type: "string" }
                        }
                    }
                }
            },
            editable: false,
            eventTemplate: '<div style="background-color: #: background #; width: 100%;">#= name #</div>'
        });
    });
}

showCalender();

</script>
