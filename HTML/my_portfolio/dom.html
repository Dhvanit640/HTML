    <script>

        const currentYear = new Date().getFullYear();
        const minYear = 1900;
        const searchBtn = document.getElementById("searchBtn");

        function showToast(message) {
            var toast = document.getElementById("customToast");
            toast.innerText = message;
            toast.classList.add("show");
            setTimeout(function () {
                toast.classList.remove("show");
            }, 3000);
        }
        function validateDates() {

            let startDate = document.getElementById("start_date");
            let endDate = document.getElementById("end_date");

            let startdate = startDate.value;
            let enddate = endDate.value;

            // ✅ Normal select value (not Kendo)
            let selectedcompanyname = document.getElementById("company_name").value;

            // Company Validation
            if (!selectedcompanyname) {
                showToast("Please Select Company Name");
                return false;
            }

            // Start Date Validation
            if (!startdate) {
                showToast("Please Select Start Date");
                return false;
            }

            // End Date Validation
            if (!enddate) {
                showToast("Please Select End Date");
                return false;
            }

            // Convert input date safely (local time)
            const startParts = startdate.split("-");
            const endParts = enddate.split("-");

            const start = new Date(startParts[0], startParts[1] - 1, startParts[2]);
            const end = new Date(endParts[0], endParts[1] - 1, endParts[2]);

            // Today's date without time
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());


            const startYear = start.getFullYear();
            const endYear = end.getFullYear();

            // Year Range Check
            if (startYear < minYear || startYear > currentYear) {
                showToast("Start year must be between 1900 and current year.");
                startDate.value = "";
                return false;
            }

            if (endYear < minYear || endYear > currentYear) {
                showToast("End year must be between 1900 and current year.");
                endDate.value = "";
                return false;
            }

            // Future Date Check
            if (start > today) {
                showToast("Start date cannot be in the future.");
                startDate.value = "";
                return false;
            }

            if (end > today) {
                showToast("End date cannot be in the future.");
                endDate.value = "";
                return false;
            }

            // Start > End Check
            if (start > end) {
                showToast("Start date cannot be greater than End date.");
                endDate.value = "";
                return false;
            }

            return true;
        }

        function get_companyname() {
            // Destroy previous ComboBox if exists to force reload
            var empCombo = $("#company_name").data("kendoComboBox");
            if (empCombo) {
                empCombo.destroy();
                $("#company_name").off();
                $("#company_name").siblings(".k-clear-value").remove();
                $("#company_name").empty();
                empCombo.value("");
            }
            var getUrl = window.location;
            var baseurl = getUrl.protocol + "//" + getUrl.host + "/" + getUrl.pathname.split("/")[1];
            baseurl = baseurl.split("pages")[0];
            var cloudcode = window.targetcloud ? `&cloudcode=${encodeURIComponent(window.targetcloud)}` : "";
            var tokenParam = window.token ? `&token=${encodeURIComponent(window.token)}` : "";

            function resetMultiSelect(id) {
                let widget = $(id).data("kendoMultiSelect");
                if (widget) widget.destroy();

                $(id).kendoMultiSelect({
                    dataSource: [],
                    downArrow: true
                });
            }

            // 👉 Reset all dropdowns
            resetMultiSelect("#project_name");
            resetMultiSelect("#branch_name");
            resetMultiSelect("#designation_name");
            resetMultiSelect("#department_name");

            $("#company_name").kendoComboBox({
                dataTextField: "text",
                dataValueField: "value",
                filter: "contains",
                suggest: true,
                minLength: 0,
                autoBind: false,
                noDataTemplate: $("#noDataTemplate").html(),

                dataSource: {
                    serverFiltering: true,
                    transport: {
                        read: function (options) {
                            const typedVal = options.data?.filter?.filters?.[0]?.value || "";

                            const urltotal =
                                `${baseurl}SaveFormField.do?actn=retrieveDComboList&extension=` +
                                `&jcodelist=${encodeURIComponent(typedVal)}@j@@jj@` +
                                `&jidlist=19675@@19675/;&filtervalue=&ask=COMMAND_NAME_1` +
                                `&random=441&AjaxRequestUniqueId=17701969065414${cloudcode}${tokenParam}`;

                            fetch(urltotal)
                                .then(res => res.text())
                                .then(data => {
                                    const companyname = data
                                        .split(";;")
                                        .filter(v => v.trim() !== "")
                                        .map(v => ({ text: v, value: v }));

                                    options.success(companyname);
                                })
                                .catch(err => {
                                    console.error("Company fetch error:", err);
                                    options.error();
                                });
                        }
                    }
                },
                change: function () {
                    //    let combo = $("#employee_name").data("kendoComboBox");
                    //    let selectedEmpValue = combo.value("");
                    let combo = $("#employee_name").data("kendoComboBox");
                    if (combo) {
                        combo.select(-1);   // clear selection
                        combo.value("");
                        combo.text("");
                    }

                    // selectedEmpValue;
                    get_projectname();
                    get_branchname();
                    get_designation();
                    get_department();
                    get_employeename();
                    $("#emp_code").val("");
                    $("#emp_status").val("");
                    $("#start_date").val("");
                    $("#end_date").val("");
                    $("#net_salary").val("");
                    var paymentCombo = $("#payment_mode").data("kendoComboBox");
                    if (paymentCombo) {
                        paymentCombo.value("");
                        paymentCombo.text("");
                    }

                    let comboBox = this;
                    if (comboBox.selectedIndex === -1) {
                        comboBox.value("");
                        comboBox.text("");
                        return;
                    }

                    // loadSalaryTable();
                }
            });
            const companyCombo = $("#company_name").data("kendoComboBox");
            companyCombo.dataSource.read();

        }

                            fetch(urltotal)
                                .then(res => res.text())
                                .then(data => {
                                    const employeename = data
                                        .split(";;")

                                        .map(v => ({ text: v, value: v }));

                                    options.success(employeename);

        function stripHtml(html) {
            var div = document.createElement("div");
            div.innerHTML = html;
            return div.textContent || div.innerText || "";
        }


        function get_employeeCode() {
            var getUrl = window.location;
            var baseurl = getUrl.protocol + "//" + getUrl.host + "/" + getUrl.pathname.split("/")[1];
            baseurl = baseurl.split("pages")[0];
            var cloudcode = window.targetcloud ? `&cloudcode=${encodeURIComponent(window.targetcloud)}` : "";
            var tokenParam = window.token ? `&token=${encodeURIComponent(window.token)}` : "";

            var empCombo = $("#employee_name").data("kendoComboBox");
            var selectedempName = empCombo ? empCombo.value() : "";

            if (!selectedempName) {
                $("#emp_code").val("");
                $("#emp_status").val("");
                $("#start_date").val("");
                $("#end_date").val("");
                var paymentCombo = $("#payment_mode").data("kendoComboBox");
                if (paymentCombo) {
                    paymentCombo.value("");
                    paymentCombo.text("");
                }
                return;
            }
            var codeUrl = `${baseurl}getFunction.do?actn=evaluatesql&extension=&jcodelist=${encodeURIComponent(selectedempName)}@j@@jj@&jidlist=19677@@19678/;&ask=COMMAND_NAME_1${cloudcode}${tokenParam}`;
            fetch(codeUrl)
                .then(res => res.text())
                .then(data => {
                    let empCode = data.split("#")[1].split(":")[0];
                    // if (!empCode || empCode === "" || empCode === "</span>") {
                    //     return; 
                    // }
                    document.getElementById("emp_code").value = empCode;

                    var statusUrl = `${baseurl}getFunction.do?actn=evaluatesql&extension=&jcodelist=${encodeURIComponent(empCode)}@j@@jj@&jidlist=29342@@19677/;&ask=COMMAND_NAME_1${cloudcode}${tokenParam}`;
                    return fetch(statusUrl);
                })
                .then(res => res.text())
                .then(statusData => {

                    let empStatus = statusData.split("#")[1].split(":")[0];
                    document.getElementById("emp_status").value = empStatus;
                    // SaveFormField.do?actn=fetchFormField&formid=524&fetchformid=307&fieldid=29342&fieldValue=Separated&matchingField=Employee%20Status&matchingFieldValues=Separated%40%40&ask=COMMAND_NAME_1&random=885&AjaxRequestUniqueId=177020115839924
                    var paymentUrl = `${baseurl}SaveFormField.do?actn=fetchFormField&formid=524&fetchformid=307&fieldid=29342&fieldValue=Separated&matchingField=Employee%20Status&matchingFieldValues=${encodeURIComponent(empStatus)}&ask=COMMAND_NAME_1&random=885&AjaxRequestUniqueId=177020115839924${cloudcode}${tokenParam}`;
                    return fetch(paymentUrl);
                })
                .then(res => res.text())
                .then(paymentData => {

                    // Example: TRANSFER01/07/202231/07/2022
                    let data = stripHtml(paymentData).trim();

                    var paymentCombo = $("#payment_mode").data("kendoComboBox");

                    // 🔴 CASE 1: Only payment mode (CHEQUE / CASH)
                    if (data.length <= 10) {

                        let payMode = data.trim();

                        if (paymentCombo) {
                            paymentCombo.value(payMode);
                            paymentCombo.text(payMode);
                        }

                        // Clear dates
                        $("#start_date").val("");
                        $("#end_date").val("");
                        return;
                    }

                    // 🟢 CASE 2: Payment + dates (TRANSFER01/07/202231/07/2022)
                    let endDate = data.slice(-10);
                    let startDate = data.slice(-20, -10);
                    let payMode = data.slice(0, -20).trim();

                    if (paymentCombo) {
                        paymentCombo.value(payMode);
                        paymentCombo.text(payMode);
                    }

                    // Convert DD/MM/YYYY → YYYY-MM-DD
                    function toISODate(d) {
                        let [dd, mm, yyyy] = d.split("/");
                        return `${yyyy}-${mm}-${dd}`;
                    }

                    $("#start_date").val(toISODate(startDate));
                    $("#end_date").val(toISODate(endDate));

                })
                .catch(error => {
                    console.error("Error fetching employee code:", error);
                    document.getElementById("emp_code").value = "";
                    document.getElementById("emp_status").value = "";
                });
        }

                url += "&token=" + encodeURIComponent(tokenParam);
            }

            let data = callajax(url);

            data = JSON.parse(data);

            // document.getElementsByClassName('tableMain')[0].style.display = 'block';


            if (data.length == 0 || data[0].txt == "txt is null" || data[0].txt == null || data[0].txt == undefined || data == '') {
                document.getElementById("salary_table").innerHTML = `<div style="display: flex;justify-content: center;align-items: center;flex-direction: column;height: 300px;gap: 10px;border: 1px solid lightgray;border-top-left-radius: 10px;border-top-right-radius: 10px;"> <img src="./images/data_not_found.svg" alt="" class="no-data-image"><div class="no-data">Data Not Found</div></div>`;
                return;
            }

            data = JSON.parse(data[0].txt);

            // 👉 Dynamic allowance headers
            let allowanceSet = new Set();
            data.forEach(row => allowanceSet.add(row.allowance_name));
            let allowanceHeaders = Array.from(allowanceSet);

            // 👉 Group employee data
            let employeeMap = {};

            data.forEach(row => {
                let key = row.employee_code;

                if (!employeeMap[key]) {
                    employeeMap[key] = {
                        employee_code: row.employee_code,
                        employee_name: row.employee_name,
                        department: row.department,
                        designation: row.designation,
                        allowances: {},
                        arrears: row.arrears,
                        total_salary: row.toatal_salary,
                        approved_salary: row.approved_salary,
                        net_salary: row.net_salary,
                        mode_of_payment: row.mode_of_payment,
                        bank_ac_no: row.bank_ac_no,
                        narration: row.narration
                    };
                }

                employeeMap[key].allowances[row.allowance_name] = row.value_erned;
            });

            // 👉 Build table
            let table = `<table>
                <thead style="position:sticky;top:0;">
                    <tr>
                        <th>Emp Code</th>
                        <th>Name</th>
                        <th>Department</th>
                        <th>Designation</th>`;

            allowanceHeaders.forEach(name => {
                table += `<th>${name}</th>`;
            });

            table += `
                <th>Arrears</th>
                <th>Total Salary</th>
                <th>Approved Salary</th>
                <th>Net Salary</th>
                <th>Payment Mode</th>
                <th>Bank A/C</th>
                <th>Narration</th>
                </tr>
                </thead>
                <tbody>`;

            Object.values(employeeMap).forEach(emp => {
                table += `<tr>
                    <td>${emp.employee_code}</td>
                    <td>${emp.employee_name}</td>
                    <td>${emp.department}</td>
                    <td>${emp.designation}</td>`;

                allowanceHeaders.forEach(name => {
                    table += `<td>${roundNum(emp.allowances[name] || 0)}</td>`;
                });

                table += `
                    <td>${roundNum(emp.arrears)}</td>
                    <td>${roundNum(emp.total_salary)}</td>
                    <td><b>${roundNum(emp.approved_salary)}</b></td>
                    <td><b>${roundNum(emp.net_salary)}</b></td>
                    <td>${emp.mode_of_payment}</td>
                    <td>${emp.bank_ac_no}</td>
                    <td>${emp.narration || "-"}</td>
                </tr>`;
            });

            table += `</tbody></table>`;

            document.getElementById("salary_table").innerHTML = table;
        }

        function downloadExcel() {
            let table = document.querySelector("#salary_table table");
            if (!table) {
                alert("No Data Found");
                return;
            }
            let workbook = XLSX.utils.table_to_book(table, { sheet: "Salary Report" });
            XLSX.writeFile(workbook, "Salary_Report.xlsx");
        }

        // function roundNum(val) {
        //     return isNaN(val) ? val : Math.round(Number(val));
        // }
        const input = document.getElementById("net_salary");

        input.addEventListener("input", function () {

            // Allow only digits
            let value = this.value.replace(/[^0-9]/g, '');

            if (value === "") {
                this.value = "";
                return;
            }

            // Format Indian style
            this.value = Number(value).toLocaleString("en-IN");
        });


    </script>
